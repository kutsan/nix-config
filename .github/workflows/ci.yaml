name: CI

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - '**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Flake Darwin Evaluation
            command: nix build .#checks.$CURRENT_SYSTEM.flake-darwin-evaluation --print-build-logs
          - name: Flake Evaluation
            command: nix flake check --no-build
          - name: Flake NixOS Evaluation
            command: nix build .#checks.$CURRENT_SYSTEM.flake-nixos-evaluation --print-build-logs
          - name: Lua Lint
            command: nix build .#checks.$CURRENT_SYSTEM.lua-lint --print-build-logs
          - name: Lua Types
            command: nix build .#checks.$CURRENT_SYSTEM.lua-types --print-build-logs
          - name: Markdown Lint
            command: nix build .#checks.$CURRENT_SYSTEM.markdown-lint --print-build-logs
          - name: Nix Format
            command: nix build .#checks.$CURRENT_SYSTEM.nix-format --print-build-logs
          - name: Nix Lint
            command: nix build .#checks.$CURRENT_SYSTEM.nix-lint --print-build-logs
          - name: Shell Format
            command: nix build .#checks.$CURRENT_SYSTEM.shell-format --print-build-logs
          - name: Shell Lint
            command: nix build .#checks.$CURRENT_SYSTEM.shell-lint --print-build-logs
          - name: TOML Format
            command: nix build .#checks.$CURRENT_SYSTEM.toml-format --print-build-logs
          - name: Workflow Lint
            command: nix build .#checks.$CURRENT_SYSTEM.workflow-lint --print-build-logs
          - name: Workflow Pins
            command: nix build .#checks.$CURRENT_SYSTEM.workflow-pins --print-build-logs
          - name: Workflow Security
            command: nix build .#checks.$CURRENT_SYSTEM.workflow-security --print-build-logs
          - name: Workflow Security Online
            command: nix run .#workflow-security-online
          - name: XML Lint
            command: nix build .#checks.$CURRENT_SYSTEM.xml-lint --print-build-logs
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@4b040423529d49b1a19ba918742e0aa9aa95031a # v3.24.3
        with:
          diagnostic-endpoint: ''

      - name: ${{ matrix.name }}
        env:
          COMMAND: ${{ matrix.command }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          CURRENT_SYSTEM=$(nix config show system)
          export CURRENT_SYSTEM
          eval "$COMMAND"
