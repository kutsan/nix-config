name: CI

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - '**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Shellcheck
            command: check-shellcheck
          - name: Selene
            command: check-selene
          - name: Neovim Types
            command: check-neovim-types
          - name: Zizmor
            command: check-zizmor
          - name: Pinact
            command: check-pinact
          - name: Shfmt
            command: check-shfmt
          - name: Taplo
            command: check-taplo
          - name: Actionlint
            command: check-actionlint
          - name: Nix
            command: check-nix
          - name: Just
            command: check-just
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@92957199488000b908fdad19f63711000965d8f3 # v3.24.1
        with:
          diagnostic-endpoint: ''

      - name: ${{ matrix.name }}
        env:
          COMMAND: ${{ matrix.command }}
          GITHUB_TOKEN: ${{ github.token }}
        run: nix develop .#ci --command just "$COMMAND"
